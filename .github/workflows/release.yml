name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify tag matches package version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node -e "
          const fs = require('fs');
          const tag = (process.env.GITHUB_REF_NAME || '').replace(/^v/, '');
          const pkg = require('./package.json');
          if (pkg.version !== tag) { console.error('package.json version ' + pkg.version + ' != tag ' + tag); process.exit(1); }
          const tauri = JSON.parse(fs.readFileSync('./src-tauri/tauri.conf.json', 'utf8'));
          if (tauri.version !== tag) { console.error('tauri.conf.json version ' + tauri.version + ' != tag ' + tag); process.exit(1); }
          const cargo = fs.readFileSync('./src-tauri/Cargo.toml', 'utf8');
          const m = cargo.match(/^version\s*=\s*\"([^\"]+)\"/m);
          const cargoVer = m ? m[1] : '';
          if (cargoVer !== tag) { console.error('Cargo.toml version ' + cargoVer + ' != tag ' + tag); process.exit(1); }
          "

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.5.20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Vibe99 ${{ github.ref_name }}'
          releaseBody: ''
          releaseDraft: true
          prerelease: false

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify tag matches package version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node -e "
          const fs = require('fs');
          const tag = (process.env.GITHUB_REF_NAME || '').replace(/^v/, '');
          const pkg = require('./package.json');
          if (pkg.version !== tag) { console.error('package.json version ' + pkg.version + ' != tag ' + tag); process.exit(1); }
          const tauri = JSON.parse(fs.readFileSync('./src-tauri/tauri.conf.json', 'utf8'));
          if (tauri.version !== tag) { console.error('tauri.conf.json version ' + tauri.version + ' != tag ' + tag); process.exit(1); }
          const cargo = fs.readFileSync('./src-tauri/Cargo.toml', 'utf8');
          const m = cargo.match(/^version\s*=\s*\"([^\"]+)\"/m);
          const cargoVer = m ? m[1] : '';
          if (cargoVer !== tag) { console.error('Cargo.toml version ' + cargoVer + ' != tag ' + tag); process.exit(1); }
          "

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.5.20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Vibe99 ${{ github.ref_name }}'
          releaseBody: ''
          releaseDraft: true
          prerelease: false

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify tag matches package version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node -e "
          const fs = require('fs');
          const tag = (process.env.GITHUB_REF_NAME || '').replace(/^v/, '');
          const pkg = require('./package.json');
          if (pkg.version !== tag) { console.error('package.json version ' + pkg.version + ' != tag ' + tag); process.exit(1); }
          const tauri = JSON.parse(fs.readFileSync('./src-tauri/tauri.conf.json', 'utf8'));
          if (tauri.version !== tag) { console.error('tauri.conf.json version ' + tauri.version + ' != tag ' + tag); process.exit(1); }
          const cargo = fs.readFileSync('./src-tauri/Cargo.toml', 'utf8');
          const m = cargo.match(/^version\s*=\s*\"([^\"]+)\"/m);
          const cargoVer = m ? m[1] : '';
          if (cargoVer !== tag) { console.error('Cargo.toml version ' + cargoVer + ' != tag ' + tag); process.exit(1); }
          "

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.5.20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Vibe99 ${{ github.ref_name }}'
          releaseBody: ''
          releaseDraft: true
          prerelease: false

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-linux
      - build-windows

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract release notes
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node ./scripts/extract-release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
          cat >> release-notes.md << 'EOF'

          ---

          ### macOS Installation Note

          macOS may show **"Vibe99 is damaged and can't be opened"** because the app is not yet notarized with Apple. To fix this, run the following command in Terminal after installing:

          ```bash
          xattr -cr /Applications/Vibe99.app
          ```
          EOF

      - name: Append release notes to draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
