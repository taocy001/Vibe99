<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Vibe99</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="tabs-panel" aria-label="Pane tabs">
        <div class="tabs-list" id="tabs-list"></div>
        <div class="tabs-actions">
          <button class="tabs-add" id="tabs-add" type="button" aria-label="Add pane"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 1V9M1 5H9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        </div>
        <section class="settings-panel is-hidden" id="settings-panel" aria-label="Settings">

          <!-- Tab navigation -->
          <nav class="settings-tabs" role="tablist">
            <button class="settings-tab-btn is-active" role="tab" data-tab="appearance" aria-selected="true" data-i18n="settings.tab.appearance">Appearance</button>
            <button class="settings-tab-btn" role="tab" data-tab="window" aria-selected="false" data-i18n="settings.tab.window">Window</button>
            <button class="settings-tab-btn" role="tab" data-tab="general" aria-selected="false" data-i18n="settings.tab.general">General</button>
          </nav>

          <!-- Appearance tab -->
          <div class="settings-tab-panel" id="settings-tab-appearance" role="tabpanel">
            <div class="settings-section">

              <div class="settings-segmented" id="color-mode-segmented" role="group" aria-label="Color mode">
                <button class="settings-segment is-active" data-value="dark" data-i18n="settings.colorMode.dark">Dark</button>
                <button class="settings-segment" data-value="light" data-i18n="settings.colorMode.light">Light</button>
                <button class="settings-segment" data-value="auto" data-i18n="settings.colorMode.auto">Auto</button>
              </div>

              <div class="settings-divider"></div>

              <label class="settings-label" for="font-family-input" data-i18n="settings.font">Font</label>
              <input class="settings-number" id="font-family-input" type="text" placeholder="MesloLGS NF, Menlo, monospace" value="" />

              <label class="settings-row" for="font-size-input">
                <span data-i18n="settings.fontSize">Font size</span>
                <span id="font-size-display" class="settings-value">13</span>
              </label>
              <input id="font-size-input" type="range" min="10" max="24" step="1" value="13" />

              <div class="settings-divider"></div>

              <label class="settings-row" for="scrollback-input">
                <span data-i18n="settings.scrollback">Scrollback</span>
                <span id="scrollback-display" class="settings-value">5000</span>
              </label>
              <input id="scrollback-input" type="range" min="1000" max="50000" step="1000" value="5000" />

              <div class="settings-divider"></div>

              <label class="settings-row" for="show-status-bar-toggle">
                <span data-i18n="settings.showStatusBar">Show status bar</span>
                <input id="show-status-bar-toggle" class="settings-toggle" type="checkbox" />
              </label>

              <div class="settings-divider"></div>

              <label class="settings-label" for="status-bar-format" data-i18n="settings.statusBarFormat">Status bar format</label>
              <input class="settings-number" id="status-bar-format" type="text" placeholder="\w\p" value="\w\p" />
              <p class="settings-caption"><code>\w</code> dir &nbsp; <code>\W</code> dirname &nbsp; <code>\u</code> user &nbsp; <code>\h</code> host &nbsp; <code>\H</code> full host &nbsp; <code>\p</code> panel</p>

              <label class="settings-label" for="status-bar-hints" data-i18n="settings.statusBarHints">Hints</label>
              <input class="settings-number" id="status-bar-hints" type="text" placeholder="*" value="*" />
              <p class="settings-caption"><code>*</code> all &nbsp; empty = none &nbsp; or action IDs: <code>enterNav,newPane,cycleRecent</code></p>

            </div>
          </div>

          <!-- Window tab -->
          <div class="settings-tab-panel is-hidden" id="settings-tab-window" role="tabpanel">
            <div class="settings-section">

              <label class="settings-row" for="pane-width-range">
                <span data-i18n="settings.paneWidth">Width</span>
                <span id="pane-width-value" class="settings-value">720px</span>
              </label>
              <input id="pane-width-range" type="range" min="520" max="2000" step="10" value="720" />

              <label class="settings-row" for="pane-opacity-range">
                <span data-i18n="settings.paneOpacity">Opacity</span>
                <span id="pane-opacity-value" class="settings-value">0.80</span>
              </label>
              <input id="pane-opacity-range" type="range" min="0.55" max="1" step="0.01" value="0.8" />

              <label class="settings-row" for="pane-mask-alpha-range">
                <span data-i18n="settings.inactiveTint">Inactive dim</span>
                <span id="pane-mask-alpha-value" class="settings-value">0.25</span>
              </label>
              <input id="pane-mask-alpha-range" type="range" min="0" max="1" step="0.01" value="0.25" />

              <div class="settings-divider"></div>

              <label class="settings-row" for="breathing-alert-toggle">
                <span data-i18n="settings.activityIndicator">Activity indicator</span>
                <input id="breathing-alert-toggle" class="settings-toggle" type="checkbox" checked />
              </label>

              <div class="settings-divider"></div>

              <label class="settings-label" for="window-title-format" data-i18n="settings.windowTitleFormat">Window title</label>
              <input class="settings-number" id="window-title-format" type="text" placeholder="\w" value="\w" />
              <p class="settings-caption"><code>\w</code> dir &nbsp; <code>\W</code> dirname &nbsp; <code>\u</code> user &nbsp; <code>\h</code> host &nbsp; <code>\H</code> full host &nbsp; <code>\p</code> panel</p>

            </div>
          </div>

          <!-- General tab -->
          <div class="settings-tab-panel is-hidden" id="settings-tab-general" role="tabpanel">
            <div class="settings-section">

              <label class="settings-label" for="language-select" data-i18n="settings.language">Language</label>
              <select id="language-select" class="settings-select"></select>

              <div class="settings-divider"></div>

              <div class="settings-row settings-clickable-row" id="shell-profiles-settings-btn" role="button" tabindex="0" aria-label="Configure shell profiles">
                <span data-i18n="settings.shellProfiles">Shell Profiles</span>
                <span class="settings-row-hint">›</span>
              </div>
              <div class="settings-row settings-clickable-row" id="keyboard-shortcuts-settings-btn" role="button" tabindex="0" aria-label="Configure keyboard shortcuts">
                <span data-i18n="settings.keyboardShortcuts">Keyboard Shortcuts</span>
                <span class="settings-row-hint">›</span>
              </div>
              <div class="settings-row settings-clickable-row" id="shell-integration-install-btn" role="button" tabindex="0" aria-label="Install shell integration">
                <span data-i18n="settings.installShellIntegration">Install Shell Integration</span>
                <span class="settings-row-hint">›</span>
              </div>

            </div>
          </div>

        </section>
      </header>

      <main class="stage-wrap">
        <section class="stage" id="stage" aria-label="Pane stage"></section>
      </main>

      <footer class="status-bar">
        <span id="broadcast-indicator">⊕ BROADCAST</span>
        <span id="status-label"></span>
        <span class="status-hint" id="status-hint"></span>
      </footer>
    </div>

    <div class="search-bar is-hidden" id="search-bar" role="search" aria-label="Terminal search">
      <input type="text" id="search-input" class="search-input" placeholder="Search…" aria-label="Search terminal" autocomplete="off" spellcheck="false" />
      <span id="search-count" class="search-count" aria-live="polite"></span>
      <button id="search-prev" type="button" class="search-nav" aria-label="Previous match" title="Previous (Shift+Enter)">↑</button>
      <button id="search-next" type="button" class="search-nav" aria-label="Next match" title="Next (Enter)">↓</button>
      <button id="search-close" type="button" class="search-close" aria-label="Close search">×</button>
    </div>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
